name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ""
          - label: Linux x64
            os: ubuntu-22.04
            args: ""
          - label: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - run: npm ci

      # Tagged push: build and attach installers to a GitHub Release.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Overhead ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS and Linux. See the README for provider terms and notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Manual run: build only, keep the installers as workflow artifacts.
      - name: Build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: overhead-${{ matrix.label }}
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
