name: Release

on:
  push:
    tags: ["v*"]
    # Every push to main refreshes the rolling "latest" release.
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
    # Pushing to this branch runs a build-only check (no release is published).
    branches: ["release-check"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rolling release: remove the previous "latest" release and tag so the new one points at this commit.
  prepare:
    name: Reset rolling release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

  build:
    needs: [prepare]
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ""
          - label: Linux x64
            os: ubuntu-22.04
            args: ""
          - label: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - run: npm ci

      # Push to main: publish installers to the rolling "latest" pre-release.
      - name: Build and publish latest
        if: github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: "Overhead (latest build)"
          releaseBody: "Automatic build of the newest commit on main. Unsigned. Download the installer for your system below."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      # Tagged push: build and attach installers to a versioned GitHub Release.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Overhead ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS and Linux. See the README for provider terms and notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Manual run: build only, keep the installers as workflow artifacts.
      - name: Build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: overhead-${{ matrix.label }}
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error
